# vi: filetype=nginx

if ($host != $app_host) {
  return 301 https://$app_host$request_uri;
}

location  ~ ^/engagement(/?)(.*) {
  resolver 8.8.8.8 1.1.1.1 valid=1m;
  proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Prefix /engagement;
  proxy_pass $wordpress/$2$is_args$args;
}

location = /fresque-benevolat {
  return 301 /fresque-benevolat/;
}

# ^~ so static-asset regex locations below do not steal /fresque-benevolat/*.js|css
# Prefix proxy_pass (no $vars) so Location redirects keep the /fresque-benevolat prefix
location ^~ /fresque-benevolat/ {
  resolver 8.8.8.8 1.1.1.1 valid=1m;
  proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Prefix /fresque-benevolat;
  proxy_pass https://fresque-benevolat-prod.osc-secnum-fr1.scalingo.io/;
  proxy_redirect / /fresque-benevolat/;
  proxy_redirect https://fresque-benevolat-prod.osc-secnum-fr1.scalingo.io/ /fresque-benevolat/;
}


